# nginx.conf — the reverse proxy config.
# nginx listens on port 80 (inside its container) and forwards every request
# to the Node app. "server:3000" works because docker-compose puts both
# containers on one network where each is reachable by its service name.

upstream jasjus_app {
    server server:3000;   # "server" = the service name in docker-compose.yml
}

server {
    listen 80;

    location / {
        proxy_pass http://jasjus_app;

        # Pass along useful info about the original request to the app.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
