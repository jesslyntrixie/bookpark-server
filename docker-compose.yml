# docker-compose.yml
# Runs TWO containers together and wires them onto one private network:
#   server  — your Node app (built from the Dockerfile)
#   nginx   — the reverse proxy that sits IN FRONT and forwards to server
#
# Only nginx is exposed to your Mac (port 8080). The app is NOT published to
# your Mac directly — the outside world reaches it only through nginx.
#
# Usage:
#   docker compose up --build        (start both; Ctrl-C to stop)
#   docker compose up -d             (start in the background)
#   docker compose down              (stop and remove)

services:
  server:
    build: .                       # build from the Dockerfile in this folder
    env_file: .env                 # broker secrets, same as before
    environment:
      DB_PATH: /app/data/jasjus.db # database lives on the volume below
    volumes:
      - jasjus-data:/app/data      # persist the SQLite db across restarts
    # NOTE: no "ports:" here on purpose — the app is only reachable from inside
    # the compose network (by nginx), not from your Mac directly.

  nginx:
    image: nginx:stable            # official nginx image, nothing to build
    ports:
      - "8080:80"                  # your Mac's 8080  ->  nginx's port 80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro  # our config (read-only)
    depends_on:
      - server                     # start server first

volumes:
  jasjus-data:                     # the named volume (same data as before)